# AeroSpace config
# Omarchy-inspired keyboard workflow for macOS.

config-version = 2

start-at-login = true
auto-reload-config = true

# SketchyBar is started by launchd (brew services); AeroSpace only restores the
# session and keeps the bar's workspace state in sync.
after-startup-command = [
    'exec-and-forget ~/.config/omarchy-mac/bin/restore-session',
]
exec-on-workspace-change = ['/bin/bash', '-c', 'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE']

# Keep the layout tree predictable as windows come and go.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 32

# Keep focus stable while interacting with transient popovers and menus.
# Chrome extension menus in particular close when hover focus reactivates the
# tiled browser window underneath them.
focus-follows-mouse.enabled = false

# AeroSpace workspaces replace macOS app hiding.
automatically-unhide-macos-hidden-apps = true

# >>> workspaces (generated by bin/render.sh from workspaces.conf) >>>
persistent-workspaces = ['web', 'code', 'term', 'misc', 'chat', 'scratch']
# <<< workspaces <<<

# 16px breathing room between tiled windows.
gaps.inner.horizontal = 16
gaps.inner.vertical = 16

# Smart M80C is 2560x1440 in macOS logical points. These edge gaps leave a
# centered 2048x1224 work area (80% width and 85% height).
# Other displays, including the built-in Retina panel, use compact edge gaps.
gaps.outer.left =   [{ monitor."Smart M80C" = 256 }, 16]
gaps.outer.right =  [{ monitor."Smart M80C" = 256 }, 16]
gaps.outer.top =    [{ monitor."Smart M80C" = 108 }, 16]
gaps.outer.bottom = [{ monitor."Smart M80C" = 108 }, 16]

# Small utility windows are more natural floating than tiled.
on-window-detected = [
    # Utility and permission windows float on the workspace that opened them.
    # Stopping here prevents the MISC fallback from pulling Settings away while
    # macOS is handing focus from a permission prompt to its Settings pane.
    { if = 'test %{app-bundle-id} = com.apple.systempreferences || test %{app-bundle-id} = com.apple.calculator || test %{app-bundle-id} = com.1password.1password || test %{app-bundle-id} = com.apple.accessibility.universalAccessAuthWarn || test %{app-bundle-id} = com.apple.installer || test %{app-bundle-id} = com.apple.archiveutility || test %{app-bundle-id} = com.apple.DiskImageMounter', run = 'layout floating' },
    # Chrome uses the same bundle ID for normal and incognito windows. Keep each
    # window where it was created so temporary/fullscreen windows aren't pulled
    # back to the main web workspace.
    { if = 'test %{app-bundle-id} = com.google.Chrome', run = 'true' },
    { if = 'test %{app-bundle-id} = app.zen-browser.zen', run = 'move-node-to-workspace chat' },
    { if = 'test %{app-bundle-id} = com.t3tools.t3code', run = 'move-node-to-workspace code' },
    { if = 'test %{app-bundle-id} = com.mitchellh.ghostty', run = 'move-node-to-workspace term' },
    { if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap', run = 'move-node-to-workspace chat' },
    { if = 'test %{app-bundle-id} = com.docker.docker', run = 'move-node-to-workspace chat' },
    # Anything without an explicit home starts floating at its natural size on
    # the catch-all workspace. Hammerspoon then tiles it if it is a real,
    # resizable app window; small and fixed-size windows stay floating.
    { if = 'true', run = ['layout floating', 'move-node-to-workspace misc'] },
]

# >>> workspace-monitors (generated by bin/render.sh from workspaces.conf) >>>
[workspace-to-monitor-force-assignment]
    web = 'Smart M80C'
    code = 'Smart M80C'
    term = 'Smart M80C'
    misc = 'Smart M80C'
    chat = 'Built-in Retina Display'
    scratch = 'Built-in Retina Display'
# <<< workspace-monitors <<<

[mode.main.binding]
    # Launchers
    alt-enter = "exec-and-forget open -na Ghostty.app"
    alt-shift-b = "exec-and-forget open -a 'Google Chrome'"
    alt-shift-e = "exec-and-forget open ~"

    # Focus: Omarchy/Vim-style navigation
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'
    alt-backtick = 'focus --wrap-around dfs-next'

    # Move/swap windows
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # Join windows into nested containers
    alt-ctrl-h = 'join-with left'
    alt-ctrl-j = 'join-with down'
    alt-ctrl-k = 'join-with up'
    alt-ctrl-l = 'join-with right'

    # Layouts
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'
    alt-f = 'fullscreen'
    alt-t = 'layout floating tiling'
    alt-b = 'balance-sizes'
    alt-r = 'mode resize'

    # >>> workspace-keys (generated by bin/render.sh from workspaces.conf) >>>
    alt-1 = 'workspace web'
    alt-2 = 'workspace code'
    alt-3 = 'workspace term'
    alt-4 = 'workspace misc'
    alt-5 = 'workspace chat'
    alt-6 = 'workspace scratch'
    alt-shift-1 = 'move-node-to-workspace --focus-follows-window web'
    alt-shift-2 = 'move-node-to-workspace --focus-follows-window code'
    alt-shift-3 = 'move-node-to-workspace --focus-follows-window term'
    alt-shift-4 = 'move-node-to-workspace --focus-follows-window misc'
    alt-shift-5 = 'move-node-to-workspace --focus-follows-window chat'
    alt-shift-6 = 'move-node-to-workspace --focus-follows-window scratch'
    # <<< workspace-keys <<<

    alt-tab = 'workspace-back-and-forth'
    alt-leftSquareBracket = 'workspace --wrap-around prev'
    alt-rightSquareBracket = 'workspace --wrap-around next'

    # Multi-monitor controls
    alt-ctrl-left = 'focus-monitor left'
    alt-ctrl-right = 'focus-monitor right'
    alt-ctrl-up = 'focus-monitor up'
    alt-ctrl-down = 'focus-monitor down'

    # Workspaces are pinned, so these move the focused window between displays.
    alt-ctrl-shift-h = 'move-node-to-monitor --focus-follows-window left'
    alt-ctrl-shift-j = 'move-node-to-monitor --focus-follows-window down'
    alt-ctrl-shift-k = 'move-node-to-monitor --focus-follows-window up'
    alt-ctrl-shift-l = 'move-node-to-monitor --focus-follows-window right'

    # Layout rescue/service menu
    alt-semicolon = 'mode service'

[mode.resize.binding]
    h = 'resize width -50'
    j = 'resize height +50'
    k = 'resize height -50'
    l = 'resize width +50'
    minus = 'resize smart -50'
    equal = 'resize smart +50'
    b = ['balance-sizes', 'mode main']
    enter = 'mode main'
    esc = 'mode main'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'balance-sizes', 'mode main']
    f = ['layout floating tiling', 'mode main']
    b = ['balance-sizes', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']
